<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Drone Show - Final Perfect Balance</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; cursor: pointer; text-align: center; padding: 20px;
        }
        #start-btn {
            background: #ffcc00; color: #000; padding: 15px 30px; border-radius: 30px;
            font-weight: bold; font-size: 18px; border: none; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="startShow()">
        <h2 style="margin-bottom: 15px;">🌸Xoay ngang màn hình nhé🌸</h2>
        <button id="start-btn">👉 CHẠM ĐỂ BẮT ĐẦU 👈</button>
    </div>

    <!-- Nhạc nền từ file nhac.mp3 đặt chung thư mục -->
    <audio id="bgMusic" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <canvas id="matrixCanvas"></canvas>

<script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');

const fontSize = 14;      
const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=<>!&%#".split("");

let stage = 'INIT'; 
let frameCount = 0;
let isStarted = false;

const whitePhrases = ["HAPPY BIRTHDAY", "NGỌC HÂN", "ALWAYS SMILE", "STAY HAPPY", "BEST WISHES"];

let columnsCount = 0;
let specialColumnIndices = []; 

function resize() {
    canvas.width = Math.floor(window.innerWidth);
    canvas.height = Math.floor(window.innerHeight);
    columnsCount = Math.floor(canvas.width / fontSize);
    
    specialColumnIndices = whitePhrases.map((_, index) => {
        return Math.floor(((canvas.width / (whitePhrases.length + 1)) * (index + 1)) / fontSize);
    });
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

// --- HỆ THỐNG CACHE PHÁT SÁNG ---
const baseSizeText = 0.85; 
const baseSizeFlower = 1.20; 
const glowRadius = baseSizeFlower * 4.5;

const textGlowCanvas = document.createElement('canvas');
const txtGlowCtx = textGlowCanvas.getContext('2d');
textGlowCanvas.width = glowRadius * 2; textGlowCanvas.height = glowRadius * 2;
txtGlowCtx.fillStyle = 'rgba(255, 255, 255, 0.25)';
txtGlowCtx.beginPath(); txtGlowCtx.arc(glowRadius, glowRadius, baseSizeText * 1.8, 0, Math.PI * 2); txtGlowCtx.fill();
txtGlowCtx.fillStyle = 'rgba(255, 255, 255, 1.0)';
txtGlowCtx.beginPath(); txtGlowCtx.arc(glowRadius, glowRadius, baseSizeText, 0, Math.PI * 2); txtGlowCtx.fill();

function createDynamicGlowCache(r, g, b, isSmall = false) {
    const cacheCanvas = document.createElement('canvas');
    const cacheCtx = cacheCanvas.getContext('2d');
    cacheCanvas.width = glowRadius * 2; cacheCanvas.height = glowRadius * 2;
    const size = isSmall ? baseSizeText : baseSizeFlower;

    cacheCtx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.08)`;
    cacheCtx.beginPath(); cacheCtx.arc(glowRadius, glowRadius, size * 4.5, 0, Math.PI * 2); cacheCtx.fill();

    cacheCtx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.35)`;
    cacheCtx.beginPath(); cacheCtx.arc(glowRadius, glowRadius, size * 2.0, 0, Math.PI * 2); cacheCtx.fill();

    cacheCtx.fillStyle = `rgba(${r}, ${g}, ${b}, 1.0)`;
    cacheCtx.beginPath(); cacheCtx.arc(glowRadius, glowRadius, size, 0, Math.PI * 2); cacheCtx.fill();
    return cacheCanvas;
}

const flowerCaches = {
    'YELLOW': createDynamicGlowCache(255, 215, 0), 
    'BROWN': createDynamicGlowCache(115, 45, 10),
    'GREEN': createDynamicGlowCache(38, 194, 103),
    'PINK': createDynamicGlowCache(255, 105, 180),
    'CYAN': createDynamicGlowCache(0, 206, 209),
    'PURPLE': createDynamicGlowCache(186, 85, 211),
    'RED': createDynamicGlowCache(255, 69, 0)
};

const colorCacheMap = new Map();
function getCachedColorCanvas(r, g, b) {
    const key = `${r},${g},${b}`;
    if (!colorCacheMap.has(key)) {
        colorCacheMap.set(key, createDynamicGlowCache(r, g, b, true));
    }
    return colorCacheMap.get(key);
}

// --- LỚP NỀN MA TRẬN ---
class PhraseDrop {
    constructor(xIndex, phrase) {
        this.xIndex = xIndex;
        this.chars = phrase.split("");
        this.init();
    }
    init() {
        this.yRow = -Math.random() * 30 - this.chars.length; 
        this.speed = 0.5;
    }
    update() {
        this.yRow += this.speed;
        if ((this.yRow - this.chars.length) * fontSize > canvas.height) this.init();
    }
    draw() {
        ctx.font = '700 ' + fontSize + 'px \'Montserrat\', sans-serif';
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; 
        const x = this.xIndex * fontSize + fontSize / 2;
        this.chars.forEach((char, i) => {
            const charY = (this.yRow + i) * fontSize;
            if (charY > 0 && charY < canvas.height) ctx.fillText(char, x, charY);
        });
        ctx.shadowBlur = 0; 
    }
}

class MatrixDrop {
    constructor(xIndex) {
        this.xIndex = xIndex;
        this.init();
    }
    init() {
        this.yRow = -Math.random() * 40;
        this.length = 8 + Math.floor(Math.random() * 12);
        this.history = Array.from({length: this.length}, () => matrixChars[Math.floor(Math.random() * matrixChars.length)]);
        this.setSpeed();
    }
    setSpeed() {
        let isWishOrFlowerStage = stage.startsWith('WISH') || stage === 'FLOWER' || stage === 'DISSOLVE';
        if (isWishOrFlowerStage) {
            this.speed = 0.6 + Math.random() * 0.6;
        } else {
            this.speed = 1.8 + Math.random() * 1.4;
        }
    }
    update() {
        if (Math.random() > 0.95) this.setSpeed();
        this.yRow += this.speed;
        if(Math.random() > 0.9) this.history[Math.floor(Math.random() * this.length)] = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        if ((this.yRow - this.length) * fontSize > canvas.height) this.init();
    }
    draw() {
        const x = this.xIndex * fontSize + fontSize / 2;
        let isWishOrFlowerStage = stage.startsWith('WISH') || stage === 'FLOWER' || stage === 'DISSOLVE';
        
        if (isWishOrFlowerStage) {
            ctx.font = (fontSize + 4) + 'px sans-serif';
            for(let i = 0; i < this.length; i += 2) {
                const charY = (this.yRow - i) * fontSize;
                if(charY > 0 && charY < canvas.height) {
                    ctx.fillStyle = i === 0 ? 'rgba(255, 165, 0, 0.55)' : 'rgba(218, 165, 32, 0.2)'; 
                    ctx.fillText('🌻', x, charY);
                }
            }
        } else {
            ctx.font = fontSize + 'px \'Montserrat\', sans-serif';
            for(let i = 0; i < this.length; i++) {
                const charY = (this.yRow - i) * fontSize;
                if(charY > 0 && charY < canvas.height) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; 
                    ctx.fillText(this.history[i], x, charY);
                }
            }
        }
    }
}

let rainDrops = [];
let phraseDrops = [];
function initRain() {
    rainDrops = []; phraseDrops = [];
    for(let i = 0; i < columnsCount; i++) {
        let specialIndex = specialColumnIndices.indexOf(i);
        if (specialIndex !== -1) phraseDrops.push(new PhraseDrop(i, whitePhrases[specialIndex]));
        if (specialColumnIndices.some(idx => Math.abs(idx - i) <= 1) && Math.random() > 0.15) continue;
        rainDrops.push(new MatrixDrop(i));
    }
}
initRain();

// --- HỆ THỐNG DRONE ---
class DroneParticle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.targetX = this.x;
        this.targetY = this.y;
        this.alpha = 0;
        this.targetAlpha = 0; 
        this.inUse = false;
        this.speed = 0.22; 
        this.rgbColor = null; 
        this.colorKey = 'WHITE';
        this.targetColorKey = 'WHITE';
        this.twinkleOffset = Math.random() * Math.PI * 2; 
        this.twinkleSpeed = 0.05 + Math.random() * 0.06; 
        this.vx = 0; this.vy = 0;
    }
    update(isActive, isExplode = false, isDissolving = false) {
        if (isDissolving && this.inUse) {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.95; this.vy *= 0.95;
            this.targetAlpha = 0;
        } else {
            let s = isExplode ? 0.35 : this.speed;
            this.x += (this.targetX - this.x) * s;
            this.y += (this.targetY - this.y) * s;
            this.targetAlpha = (isActive && this.inUse) ? 1 : 0;
        }

        this.alpha += (this.targetAlpha - this.alpha) * 0.2;

        if (this.alpha > 0.1 && this.inUse && !isExplode && !isDissolving) {
            this.twinkleOffset += this.twinkleSpeed;
            let twinkleFactor = 0.75 + Math.sin(this.twinkleOffset) * 0.25; 
            let oFactor = (stage === 'INTRO_DISSOLVE') ? 0.5 : 1.0; 
            this.currentAlpha = this.alpha * twinkleFactor * oFactor;
        } else {
            this.currentAlpha = this.alpha;
        }
        this.colorKey = this.targetColorKey;
    }
    startDissolve() {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1.5 + Math.random() * 4.0; 
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed; 
    }
    draw() {
        if (this.currentAlpha > 0.01) {
            ctx.globalAlpha = this.currentAlpha;
            if (this.rgbColor) {
                let cacheCanvas = getCachedColorCanvas(this.rgbColor.r, this.rgbColor.g, this.rgbColor.b);
                ctx.drawImage(cacheCanvas, this.x - glowRadius, this.y - glowRadius);
            } else if (this.colorKey === 'WHITE') {
                ctx.drawImage(textGlowCanvas, this.x - glowRadius, this.y - glowRadius);
            } else {
                let imgCache = flowerCaches[this.colorKey] || textGlowCanvas;
                ctx.drawImage(imgCache, this.x - glowRadius, this.y - glowRadius);
            }
            ctx.globalAlpha = 1.0; 
        }
    }
}

let drones = [];
const maxDrones = 5000; 
for(let i=0; i<maxDrones; i++) drones.push(new DroneParticle());

// --- THUẬT TOÁN QUÉT TEXT ---
function generateTextTargets(text1, text2 = "", iconType = "", isNumber = false) {
    let tempCanvas = document.createElement('canvas');
    let tempCtx = tempCanvas.getContext('2d');
    const w = canvas.width; const h = canvas.height;
    tempCanvas.width = w; tempCanvas.height = h;
    
    tempCtx.textAlign = 'center'; tempCtx.textBaseline = 'middle'; tempCtx.fillStyle = 'white';

    let isPortrait = h > w;
    let size = Math.min(w, h) * (isPortrait ? 0.055 : 0.078); 
    
    if (isNumber) {
        size = Math.min(w, h) * (isPortrait ? 0.45 : 0.65); 
    }

    tempCtx.font = `700 ${size}px 'Montserrat', sans-serif`; 

    if (iconType === 'CLOVER' && text2 !== "") {
        text2 += " 🍀";
    }

    if(text2 !== "") {
        tempCtx.fillText(text1, w / 2, h / 2 - size * 0.75);
        tempCtx.fillText(text2, w / 2, h / 2 + size * 0.75);
    } else {
        tempCtx.fillText(text1, w / 2, h / 2);
    }

    let imgData = tempCtx.getImageData(0, 0, w, h).data;
    let points = [];
    let step = 1.6; 
    if (isNumber) step = 4.0;

    for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
            let pixelIndex = (Math.floor(y) * w + Math.floor(x)) * 4;
            let a = imgData[pixelIndex + 3];

            if (a > 120) {
                let isColored = (Math.abs(imgData[pixelIndex] - imgData[pixelIndex+1]) > 10);
                let colorKey = 'WHITE';

                if (iconType === 'CLOVER' && isColored) {
                    colorKey = 'GREEN'; 
                }

                points.push({ 
                    x: x, y: y, 
                    color: colorKey,
                    rgbColor: null 
                });
            }
        }
    }
    return points.sort(() => 0.5 - Math.random());
}

// --- THUẬT TOÁN HOA HƯỚNG DƯƠNG LỚN ---
function generateSunflowerTargets() {
    let points = [];
    const cx = canvas.width / 2; 
    const cy = canvas.height * 0.42; 
    
    const sizeFactor = Math.min(canvas.width, canvas.height);

    const startRad = sizeFactor * (45 / 550);
    const bánKínhLớp1 = sizeFactor * 0.20; 
    const bánKínhLớp2 = sizeFactor * 0.17; 

    const vẽCánhHoaMẫu = (góc, startR, endR, độRộngMax) => {
        for(let d = startR; d <= endR; d += 3.5) {
            let tỉLệ = (d - startR) / (endR - startRad);
            let độRộngHiệnTại = Math.sin(tỉLệ * Math.PI) * Math.pow(1.02 - tỉLệ, 0.4) * độRộngMax;
            let trụcX = cx + Math.cos(góc) * d; let trụcY = cy + Math.sin(góc) * d;
            let gócVuông = góc + Math.PI / 2;

            points.push({ x: trụcX + Math.cos(gócVuông) * độRộngHiệnTại, y: trụcY + Math.sin(gócVuông) * độRộngHiệnTại, color: 'YELLOW' });
            points.push({ x: trụcX - Math.cos(gócVuông) * độRộngHiệnTại, y: trụcY - Math.sin(gócVuông) * độRộngHiệnTại, color: 'YELLOW' });

            if (tỉLệ > 0.1 && tỉLệ < 0.9) {
                let gân = độRộngHiệnTại * 0.4;
                points.push({ x: trụcX + Math.cos(gócVuông) * gân, y: trụcY + Math.sin(gócVuông) * gân, color: 'YELLOW' });
                points.push({ x: trụcX - Math.cos(gócVuông) * gân, y: trụcY - Math.sin(gócVuông) * gân, color: 'YELLOW' });
            }
        }
    };

    const gốcThânY = cy + startRad; const đáyThânY = canvas.height * 0.82; 
    for(let y = gốcThânY; y <= đáyThânY; y += 3.5) {
        let uốnX = cx + Math.sin((y - gốcThânY) * 0.008) * 2; 
        for (let offset = -4.5; offset <= 4.5; offset += 1.5) {
            points.push({ x: uốnX + offset, y: y, color: 'GREEN' });
        }
    }

    const gốcLáY = đáyThânY - (canvas.height * 0.12); 
    const độDàiLá = sizeFactor * 0.15; const gócLáChếch = -Math.PI * 0.15; 
    let rightSpinePoints = [];
    for (let l = 4; l <= độDàiLá; l += 3.0) {
        let t = l / độDàiLá;
        let lx = cx + Math.cos(gócLáChếch) * l;
        let ly = gốcLáY + Math.sin(gócLáChếch) * l - (Math.pow(t, 2) * sizeFactor * 0.035); 
        rightSpinePoints.push({ x: lx, y: ly, t: t });
        points.push({ x: lx, y: ly, color: 'GREEN' }); 
        points.push({ x: cx - (lx - cx), y: ly, color: 'GREEN' }); 
    }
    rightSpinePoints.forEach((pt) => {
        let chiềuRộngLá = Math.sin(pt.t * Math.PI) * (sizeFactor * 0.052);
        let gócVuông = gócLáChếch + Math.PI / 2;
        let viềnX1 = pt.x + Math.cos(gócVuông) * chiềuRộngLá; let viềnY1 = pt.y + Math.sin(gócVuông) * chiềuRộngLá;
        let viềnX2 = pt.x - Math.cos(gócVuông) * chiềuRộngLá; let viềnY2 = pt.y - Math.sin(gócVuông) * chiềuRộngLá;
        
        points.push({ x: viềnX1, y: viềnY1, color: 'GREEN' }); points.push({ x: viềnX2, y: viềnY2, color: 'GREEN' });
        points.push({ x: cx - (viềnX1 - cx), y: viềnY1, color: 'GREEN' }); points.push({ x: cx - (viềnX2 - cx), y: viềnY2, color: 'GREEN' });
    });

    const sốCánhMỗiLớp = 22; 
    for(let i = 0; i < sốCánhMỗiLớp; i++) {
        let góc = (i / sốCánhMỗiLớp) * Math.PI * 2;
        vẽCánhHoaMẫu(góc, startRad, bánKínhLớp1, sizeFactor * 0.026);
    }
    for(let i = 0; i < sốCánhMỗiLớp; i++) {
        let góc = ((i + 0.5) / sốCánhMỗiLớp) * Math.PI * 2;
        vẽCánhHoaMẫu(góc, startRad, bánKínhLớp2, sizeFactor * 0.022);
    }

    const bánKínhNhụyMax = startRad * 1.22; 
    const tổngSốHạtNhụy = 480; 
    const GÓC_VÀNG = 137.5 * (Math.PI / 180); 
    for (let i = 0; i < tổngSốHạtNhụy; i++) {
        let tỉLệ = i / tổngSốHạtNhụy;
        let r = Math.sqrt(tỉLệ) * bánKínhNhụyMax; 
        let góc = i * GÓC_VÀNG; 
        points.push({ x: cx + Math.cos(góc) * r, y: cy + Math.sin(góc) * r, color: 'BROWN' });
    }
    return points;
}

function assignTargets(targets, isFlash = false, colorOverride = null) {
    drones.forEach(d => { d.inUse = false; d.rgbColor = null; });
    for(let i = 0; i < targets.length && i < drones.length; i++) {
        drones[i].targetX = targets[i].x;
        drones[i].targetY = targets[i].y;
        drones[i].targetColorKey = colorOverride || targets[i].color || 'WHITE';
        drones[i].rgbColor = targets[i].rgbColor || null; 
        drones[i].inUse = true; 
    }
    for(let i = targets.length; i < drones.length; i++) {
        if (isFlash) {
            let angle = Math.random() * Math.PI * 2;
            let dist = Math.random() * canvas.width * 0.5;
            drones[i].targetX = canvas.width/2 + Math.cos(angle)*dist;
            drones[i].targetY = canvas.height/2 + Math.sin(angle)*dist;
            drones[i].targetColorKey = 'WHITE';
            drones[i].inUse = true;
        }
    }
}

function startShow() {
    if (isStarted) return;
    isStarted = true;
    
    let overlay = document.getElementById('start-overlay');
    if (overlay) overlay.style.display = 'none';
    
    let music = document.getElementById('bgMusic');
    if (music) {
        music.play().catch(e => console.log("Không thể phát nhạc:", e));
    }
    
    resize();
    initRain();
    draw();
}

function setStage(newStage) {
    stage = newStage; frameCount = 0;
    if (stage === 'CD3') assignTargets(generateTextTargets('3', '', '', true));
    else if (stage === 'CD2') assignTargets(generateTextTargets('2', '', '', true));
    else if (stage === 'CD1') assignTargets(generateTextTargets('1', '', '', true));
    else if (stage === 'FLASH') {
        let flashPoints = [];
        let numFlashDrones = Math.min(maxDrones, 1200); 
        for(let i=0; i<numFlashDrones; i++) {
            let angle = Math.random() * Math.PI * 2;
            let radius = 20 + Math.random() * canvas.width * 0.5;
            flashPoints.push({ x: canvas.width / 2 + Math.cos(angle) * radius, y: canvas.height / 2 + Math.sin(angle) * radius });
        }
        assignTargets(flashPoints, true);
    }
    else if (stage === 'FINAL') assignTargets(generateTextTargets('HAPPY BIRTHDAY', 'ÚT HÂN'));
    else if (stage === 'INTRO_DISSOLVE') drones.forEach(d => { if(d.inUse) d.startDissolve(); });
    else if (stage === 'WISH1') assignTargets(generateTextTargets('Chúc Út tuổi mới', 'mọi việc thuận lợi!', 'CLOVER')); 
    else if (stage === 'WISH2') assignTargets(generateTextTargets('Chúc Út luôn vui vẻ,', 'bình yên !', 'CLOVER'));
    else if (stage === 'WISH3') assignTargets(generateTextTargets('Chúc Út luôn hạnh phúc', 'theo cách Út muốn!!!', 'CLOVER'));
    else if (stage === 'FLOWER') assignTargets(generateSunflowerTargets()); 
    else if (stage === 'DISSOLVE') drones.forEach(d => { if(d.inUse) d.startDissolve(); });
    else if (stage === 'END_TEXT') drones.forEach(d => d.inUse = false); // Hiện chữ "Hết rồi 😉"
}

function draw() {
    if (!isStarted) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    frameCount++;

    if (stage === 'INIT' && frameCount > 180) setStage('CD3');
    else if (stage === 'CD3' && frameCount > 60) setStage('CD2');
    else if (stage === 'CD2' && frameCount > 60) setStage('CD1');
    else if (stage === 'CD1' && frameCount > 60) setStage('FLASH');
    else if (stage === 'FLASH' && frameCount > 25) setStage('FINAL');
    else if (stage === 'FINAL' && frameCount > 300) setStage('INTRO_DISSOLVE'); 
    else if (stage === 'INTRO_DISSOLVE' && frameCount > 75) setStage('WISH1');   
    else if (stage === 'WISH1' && frameCount > 360) setStage('WISH2');  
    else if (stage === 'WISH2' && frameCount > 360) setStage('WISH3');
    else if (stage === 'WISH3' && frameCount > 360) setStage('FLOWER'); 
    else if (stage === 'FLOWER' && frameCount > 420) setStage('DISSOLVE'); 
    else if (stage === 'DISSOLVE' && frameCount > 180) setStage('END_TEXT'); // Sau 10s (600 frame) kể từ khi tan hoa

    rainDrops.forEach(drop => { drop.update(); drop.draw(); });
    phraseDrops.forEach(drop => { drop.update(); });
    ctx.textAlign = 'center';
    phraseDrops.forEach(drop => { drop.draw(); });

    let isDroneVisible = (stage !== 'INIT' && stage !== 'END_TEXT');
    let isExplosion = (stage === 'FLASH');
    let isDissolving = (stage === 'DISSOLVE' || stage === 'INTRO_DISSOLVE');

    drones.forEach(drone => {
        drone.update(isDroneVisible, isExplosion, isDissolving);
        drone.draw();
    });

    // Vẽ chữ "Hết rồi 😉" ở cuối chương trình
    if (stage === 'END_TEXT') {
        ctx.save();
        ctx.font = '700 32px \'Montserrat\', sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
        ctx.shadowBlur = 15;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Hết rồi 😉', canvas.width / 2, canvas.height / 2);
        ctx.restore();
    }

    requestAnimationFrame(draw);
}
</script>
</body>
</html>
